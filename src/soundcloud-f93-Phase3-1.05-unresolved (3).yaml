# ==========================================
  # PLAYBACK & STREAMING ENGINE (MODULE 5)
  # ==========================================

  /player/state:
    get:
      tags: ["Playback & Streaming Engine"]
      summary: Get current player state
      description: Retrieves the user's last saved playback position and track for cross-device sync.
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Player state retrieved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PlayerState'
        '401':
          description: Unauthorized - User not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags: ["Playback & Streaming Engine"]
      summary: Update player state (Heartbeat)
      description: Continuously syncs the user's current playback time to the database.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentTrack, currentTime, isPlaying]
              properties:
                currentTrack:
                  type: string
                  description: Valid Track ID
                currentTime:
                  type: number
                  example: 45.5
                isPlaying:
                  type: boolean
                queueContext:
                  type: string
                  enum: ['none', 'feed', 'playlist', 'track', 'station', 'search']
                contextId:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Player state updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PlayerState'
        '400':
          description: Bad Request - Invalid track ID or missing data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - User not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /player/{id}/stream:
    get:
      tags: ["Playback & Streaming Engine"]
      summary: Get high-fidelity stream URL
      description: Evaluates tier permissions and track visibility before returning the HLS playlist URL.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Valid Track ID
      responses:
        '200':
          description: Stream access granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/StreamData'
        '400':
          description: Track audio still processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - User not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Private track or insufficient tier access
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Track not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /history/progress:
    post:
      tags: ["Playback & Streaming Engine"]
      summary: Record playback progress
      description: Logs how far a user listened. If progress >= 90% of track duration, counts as a completed play and increments track playCount.
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId, progress]
              properties:
                trackId:
                  type: string
                progress:
                  type: number
                  description: Progress in seconds
      responses:
        '200':
          description: Progress logged successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      history:
                        $ref: '#/components/schemas/HistoryRecord'
        '400':
          description: Bad Request - Missing trackId or progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - User not logged in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /history/recently-played:
    get:
      tags: ["Playback & Streaming Engine"]
      summary: Get recently played tracks
      description: Retrieves the user's personal listen history, sorted with the most recent at the top.
      security:
        - cookieAuth: []
        - bearerAuth: []
