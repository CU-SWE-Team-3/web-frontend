                                  example: "My track9"
                                artist:
                                  $ref: '#/components/schemas/User'
                                audioUrl:
                                  type: string
                                  example: "https://biobeatsstorage2026.blob.core.windows.net/biobeats-audio/track.mp3"
                                duration:
                                  type: integer
                                  example: 38
                                playCount:
                                  type: integer
                                  example: 3
                                likeCount:
                                  type: integer
                                  example: 0
                                repostCount:
                                  type: integer
                                  example: 1
                                createdAt:
                                  type: string
                                  format: date-time
                                  example: "2026-03-19T01:55:57.237Z"
                                id:
                                  type: string
                                  example: "69bb57adba53ba785c1c183e"
                      pagination:
                        type: object
                        properties:
                          total:
                            type: integer
                            example: 1
                          page:
                            type: integer
                            example: 1
                          totalPages:
                            type: integer
                            example: 1
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tracks/{id}/like:
    post:
      tags: [Engagement & Social Interactions]
      summary: Like a track
      description: Adds a like interaction. Updates the track's likeCount.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Track liked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Track already liked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags: [Engagement & Social Interactions]
      summary: Unlike a track
      description: Removes a like interaction and decrements the likeCount.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Like removed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
  /tracks/{trackId}/comments:
    post:
      tags: [Engagement & Social Interactions]
      summary: Add a timestamped comment
      description: Leave a comment at a specific second in the audio playback. Replies are restricted to one level deep.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: trackId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content, timestamp]
              properties:
                content:
                  type: string
                  maxLength: 1000
                timestamp:
                  type: integer
                  minimum: 0
                parentCommentId:
                  type: string
                  description: Optional. Include this to reply to an existing comment.
      responses:
        '201':
          description: Comment added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      comment:
                        $ref: '#/components/schemas/Comment'
        '400':
          description: Validation error or tried to reply to a reply
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Engagement & Social Interactions]
      summary: Get all comments for a track
      description: Returns top-level comments and their nested replies, sorted by audio timestamp.
      parameters:
        - in: path
          name: trackId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Comments fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  total:
                    type: integer
                  data:
                    type: object
                    properties:
                      comments:
                        type: array
                        items:
                          $ref: '#/components/schemas/Comment'

  /comments/{commentId}:
    delete:
      tags: [Engagement & Social Interactions]
      summary: Delete a comment
      description: Deletes a comment. If it is a parent comment, it cascades and deletes all replies. Only the author can delete it.
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: commentId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comment deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '403':
          description: Not authorized to delete this comment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'