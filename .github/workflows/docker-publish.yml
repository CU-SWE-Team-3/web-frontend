name: Build and Push Frontend Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: zkhaled389/biobeats-frontend:latest
          no-cache: true # Prevents the Next.js cache corruption bug!
          build-args: |
            NEXT_PUBLIC_API_URL=https://biobeats.duckdns.org/api
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=6LeDUossAAAAAMWPIJONmtqHz_9DIWkponxfVIkJ

  deploy:
    name: Deploy to Azure Server
    needs: build # This ensures it only deploys AFTER a successful build
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/biobeats-prod
            docker compose pull
            docker compose up -d
            docker image prune -f
